name: Submit a work · 投稿作品
description: Something built with Claude Fable 5.2 that opens in a browser
title: "[Submit] "
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: Work link · 作品链接
      description: Must open directly in a browser (game, 3D scene, web page, tool, or a repo with the source).
      placeholder: https://
    validations:
      required: true
  - type: input
    id: post
    attributes:
      label: Original post · 原帖链接
      description: The post on X (or elsewhere) where the creator says it was made with Fable 5.2.
      placeholder: https://x.com/...
    validations:
      required: true
  - type: input
    id: creator
    attributes:
      label: Creator · 作者
      placeholder: "@handle"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: One sentence on what it is · 一句话说明
    validations:
      required: true
